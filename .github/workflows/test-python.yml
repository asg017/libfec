name: "test-python"
on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
# A newer push to the same PR cancels the older run; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test-python:
    strategy:
      matrix:
        # PRs build on Linux only; main builds every platform we ship wheels for.
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest", "macos-15-intel", "windows-latest"]') }}
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
      - run: uv tool install maturin
      - name: Build Python wheels
        run: make build
        working-directory: crates/fec-py
      - name: Run pytest against the built wheel
        shell: bash
        run: uv run --no-project --isolated --with pytest --with "$(ls dist/*.whl | head -1)" pytest tests -q
        working-directory: crates/fec-py
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: crates/fec-py/dist/*.whl
