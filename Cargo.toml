[workspace]
resolver = "2"

members = [
    "crates/fec-parser-macros",
    "crates/fec-parser",
    "crates/fec-rss",
    "crates/fec-cli",
    "crates/fec-api", 
    "crates/fec-wasm", 
    "crates/fec-py",
    "crates/fec-node",
    "crates/fec-js-core",
]

# One version for the CLI and the `libfec` Python wheel (which ships the CLI too).
[workspace.package]
version = "0.0.35-alpha.2"

# The profile that 'cargo dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# The browser build (crates/fec-wasm, `make build` there): speed over size,
# then wasm-opt. Its own profile so native release builds are unaffected.
[profile.wasm-release]
inherits = "release"
lto = true
codegen-units = 1
opt-level = 3
panic = "abort"
