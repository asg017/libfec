[workspace]
resolver = "2"

# crates/fec-r is an R package with its own [workspace] (see its README).
exclude = ["crates/fec-r"]

members = [
    "crates/fec-parser-macros",
    "crates/fec-parser",
    "crates/fec-cli",
    "crates/fec-api", 
    "crates/fec-wasm", 
    "crates/fec-py",
]

# The profile that 'cargo dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
