[workspace]
resolver = "2"

members = [
    "crates/fec-parser-macros",
    "crates/fec-parser",
    "crates/fec-rss",
    "crates/fec-cli",
    "crates/fec-api", 
    "crates/fec-wasm", 
    "crates/fec-py",
]

# One version for the CLI and the `libfec` Python wheel (which ships the CLI too).
[workspace.package]
version = "0.0.34"

# The profile that 'cargo dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
