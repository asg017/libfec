[workspace]
resolver = "2"

members = [
    "crates/fec-parser-macros",
    "crates/fec-parser",
    "crates/fec-cli",
    "crates/fec-api", 
    "crates/fec-wasm", 
    "crates/fec-py",
    "crates/fec-node",
    "crates/fec-js-core",
]

# The profile that 'cargo dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
