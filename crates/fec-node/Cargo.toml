[package]
name = "fec-node"
version = "0.0.32"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[lib]
# Loaded by the generated native/native.js; the public API is js/index.ts.
crate-type = ["cdylib"]

[dependencies]
# Pinned exactly: napi-rs ships often and loader churn is the main risk.
napi = { version = "=3.12.6", default-features = false, features = ["napi8"] }
napi-derive = "=3.6.7"
fec-parser = { path = "../fec-parser" }
anyhow = "1.0.99"
csv = "1.2.2"
indexmap = "2.9.0"
serde = "1"
serde_json = "1.0.104"

# `gen-types` only: the TypeScript generator (src/bin/gen-types.rs).
ts-rs = { version = "=12.0.1", optional = true }

[features]
# `make gen-types`: write js/generated/ from fec-parser's typed structs.
gen-types = ["fec-parser/ts", "dep:ts-rs"]

[[bin]]
name = "gen-types"
required-features = ["gen-types"]

[build-dependencies]
napi-build = "2"
