[package]
name = "fec-js-core"
version = "0.0.32"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "The batch encodings fec-node hands to JS (raw field offsets, typed-record tokens), free of napi so a wasm32 build can share them."

[dependencies]
serde = "1"

[dev-dependencies]
fec-parser = { path = "../fec-parser" }
serde_json = "1.0.104"
csv = "1.2.2"
