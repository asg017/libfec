[package]
name = "fec-parser"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
csv = "1.2.2"
csv-core = "0.1.10"
indexmap = {version="2.9.0", features=["serde"]}
lazy_static = "1.4.0"
regex = "1.9.3"
serde_json = "1.0.104"
thiserror = "1.0.44"
fec-parser-macros = {path="../fec-parser-macros"}
bstr = "1.10.0"
jiff = { version = "0.2.5", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
anyhow = "1.0.99"
# `python`: `#[pyclass]` on the typed cover structs (`covers::*`), so the
# Python bindings (`crates/fec-py`) expose them as-is instead of mirroring them.
pyo3 = { version = "0.29", optional = true, features = ["jiff-02"] }

[features]
python = ["dep:pyo3"]
# `columnar`: `Columnar` (fec-parser-macros) on the typed covers and
# itemizations, flattening them into typed columns (`fec_parser::columnar`).
# No runtime dependency: the R bindings (`crates/fec-r`) and, later, Arrow /
# Parquet writers convert the column builders themselves.
columnar = []

[dev-dependencies]
insta = { version = "1.45.0", features = ["json"] }
