[project]
name = "libfec-parser"
dynamic = ["version"]
description = "Fast parser for FEC electronic filings (.fec), backed by Rust"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-*"]
authors = [
    { name = "Alex Garcia", email = "alexsebastian.garcia@gmail.com" }
]
keywords = ["fec", "campaign-finance", "elections", "parser"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/asg017/libfec"
Repository = "https://github.com/asg017/libfec"
Issues = "https://github.com/asg017/libfec/issues"
Changelog = "https://github.com/asg017/libfec/releases"

[dependency-groups]
dev = ["pytest>=8", "fecfile", "pandas", "nbconvert", "ipykernel", "mypy", "maturin>=1.15,<2"]

[tool.maturin]
module-name = "libfec_parser._native"
python-source = "python"

[build-system]
requires = ["maturin>=1.9.4,<2.0"]
build-backend = "maturin"
