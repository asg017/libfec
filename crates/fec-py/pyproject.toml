[project]
name = "libfec-parser"
version = "0.1.0"
description = "Fast parser for FEC electronic filings (.fec), backed by Rust"
readme = "README.md"
authors = [
    { name = "Alex Garcia", email = "alexsebastian.garcia@gmail.com" }
]
requires-python = ">=3.11"
dependencies = []
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-*"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.maturin]
module-name = "libfec_parser"
python-packages = ["libfec_parser"]
python-source = "src"

[build-system]
requires = ["maturin>=1.9.4,<2.0"]
build-backend = "maturin"
