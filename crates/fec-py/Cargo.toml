[package]
name = "fec-py"
version.workspace = true
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
# The compiled extension is private: it is imported as `libfec._native`.
# The public API lives in python/libfec/{parser,fecfile}.py.
name = "_native"
# "cdylib" is necessary to produce a shared library for Python to import from.
crate-type = ["cdylib"]

[dependencies]
# "abi3-py311" tells pyo3 (and maturin) to build using the stable ABI with minimum Python version 3.11.
# "extension-module" is intentionally absent: maturin >= 1.9.4 sets PYO3_BUILD_EXTENSION_MODULE itself,
# and leaving it off keeps `cargo test -p fec-py` linkable.
pyo3 = { version = "0.29", features = ["abi3-py311", "jiff-02"] }
# `python`: the typed cover structs are `#[pyclass]`es (`libfec.covers`).
fec-parser = { path="../fec-parser", features = ["python"] }
csv = "1.3"
# `libfec.rss`: the feed parser, without the CLI's ureq fetch.
fec-rss = { path = "../fec-rss" }
# The workspace already resolves jiff 0.2.x via fec-parser; `jiff-02` converts
# `jiff::civil::Date` to `datetime.date` (limited-API safe under abi3-py311).
jiff = "0.2"
# The whole CLI, linked into the extension: the wheel's `libfec` command is a console
# script into `_native.run_cli` (python/libfec/_cli.py), not a second binary.
fec-cli = { path = "../fec-cli" }
