[package]
name = "fec-wasm"
version = "0.1.0"
edition = "2024"

[dependencies]
wasm-bindgen = {version="0.2.100", features = ["serde-serialize"] }
fec-parser = { path = "../fec-parser" }
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.4"
tsify = "0.5.5"

[lib]
crate-type = ["cdylib"]
