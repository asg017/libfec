[workspace]
members = ["cargo:."]
packages = ["fec-cli"]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.30.3"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# The archive format to use for windows builds (defaults .zip)
windows-archive = ".tar.gz"
# The archive format to use for non-windows builds (defaults .tar.xz)
unix-archive = ".tar.gz"
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
# Local artifacts jobs to run in CI
local-artifacts-jobs = ["./build-pypi", "./build-npm"]
# Publish jobs to run in CI
publish-jobs = ["./publish-pypi"]
# Build only the packages dist ships (`-p fec-cli`), not the whole workspace:
# a workspace build also compiles fec-py's pyo3 extension, whose abi3-py311
# floor fails on ubuntu-22.04's Python 3.10.
precise-builds = true
# Don't run the Release workflow on pull requests
pr-run-mode = "skip"

[dist.github-custom-runners]
aarch64-apple-darwin = "macos-latest"
aarch64-unknown-linux-gnu = "ubuntu-22.04-arm"
global = "ubuntu-latest"
x86_64-unknown-linux-gnu = "ubuntu-22.04"
